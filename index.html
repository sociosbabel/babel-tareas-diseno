<style>
  :root{
    --navy:#101a2b; --navy2:#182742; --gold:#d0aa5e; --gold2:#e0c27a;
    --bg:#0d1420; --card:#16213a; --card2:#1c2947; --txt:#f2ede2; --muted:#9aa6bd;
    --rev:#d6a24f; --apr:#4fae6a; --eje:#7d8aa8; --danger:#c0554a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Archivo',sans-serif;background:var(--bg);color:var(--txt);}
  header{display:flex;flex-direction:column;align-items:center;padding:20px 16px 14px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);border-bottom:2px solid var(--gold);}
  header img{width:180px;margin-bottom:6px;}
  header .sub{color:var(--gold2);font-family:'Archivo',sans-serif;font-weight:700;font-size:.85rem;text-align:center;letter-spacing:.03em;}
  .wrap{max-width:900px;margin:0 auto;padding:16px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .toolbar input, .toolbar select{background:var(--card);border:1px solid #2a3a5c;color:var(--txt);padding:8px 10px;border-radius:8px;font-size:.85rem;font-family:'Archivo',sans-serif;}
  .toolbar input[type=text]{flex:1;min-width:140px;}
  .btn{background:var(--gold);color:#1a1408;border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem;font-family:'Archivo',sans-serif;}
  .btn:hover{background:var(--gold2);}
  .btn.secondary{background:var(--card2);color:var(--txt);border:1px solid #2a3a5c;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{padding:5px 11px;font-size:.72rem;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:7px 14px;border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:600;border:1px solid #2a3a5c;font-family:'Archivo',sans-serif;}
  .tab.active{background:var(--gold);color:#1a1408;border-color:var(--gold);}
  .card{background:var(--card);border:1px solid #24314f;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .card h3{margin:0 0 4px;font-family:'Quattrocento',serif;font-weight:700;font-size:1.08rem;color:var(--txt);cursor:pointer;}
  .card .meta{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;color:#0d1420;letter-spacing:.02em;}
  .badge.st-pendiente{background:var(--muted);}
  .badge.st-en-revision{background:var(--rev);}
  .badge.st-aprobada{background:var(--apr);color:#fff;}
  .badge.st-ejecutada{background:var(--eje);color:#fff;}
  .badge.prio-Alta{background:var(--danger);color:#fff;}
  .badge.prio-Media{background:var(--rev);}
  .badge.prio-Baja{background:#2a3a5c;color:var(--muted);}
  .card p{font-family:'Archivo',sans-serif;font-weight:400;font-size:.85rem;color:var(--muted);margin:8px 0 0;line-height:1.4;}
  .card .detalle{background:#20304f;border-left:3px solid var(--gold);padding:6px 10px;border-radius:6px;font-size:.78rem;color:var(--gold2);margin-top:8px;}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .actions button{font-size:.72rem;padding:5px 10px;border-radius:6px;border:1px solid #2a3a5c;background:var(--card2);color:var(--txt);cursor:pointer;font-family:'Archivo',sans-serif;font-weight:600;}
  .actions button:hover{border-color:var(--gold);color:var(--gold2);}
  .link-chip{font-size:.75rem;color:var(--gold2);text-decoration:none;font-family:'Archivo',sans-serif;font-weight:600;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem;}
  .fab{position:fixed;bottom:22px;right:22px;background:var(--gold);color:#1a1408;border:none;width:56px;height:56px;border-radius:50%;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card2);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--gold);}
  .modal h2{margin-top:0;color:var(--gold2);font-size:1.05rem;font-family:'Quattrocento',serif;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;font-family:'Archivo',sans-serif;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;background:var(--bg);border:1px solid #2a3a5c;color:var(--txt);padding:9px 10px;border-radius:8px;font-size:.88rem;font-family:'Archivo',sans-serif;}
  .field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;}
  .modal-actions .right{display:flex;gap:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1408;padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:700;display:none;z-index:99;font-family:'Archivo',sans-serif;}
  .status-note{font-size:.72rem;color:var(--muted);text-align:center;margin:6px 0 0;font-family:'JetBrains Mono',monospace;}
  footer{text-align:center;color:var(--muted);font-size:.7rem;padding:24px 10px 40px;font-family:'Archivo',sans-serif;}
  .links-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .link-row{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid #2a3a5c;border-radius:8px;padding:6px 10px;font-size:.78rem;}
  .link-row a{color:var(--gold2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .link-row .lbl{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:.68rem;padding:1px 7px;border-radius:10px;background:#24314f;}
  .link-row .lbl.final{background:var(--gold);color:#1a1408;font-weight:700;}
  .link-row button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;}
  .add-link-row{display:flex;gap:6px;margin-top:6px;}
  .add-link-row input{flex:1;}
  .gantt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .gantt-label{width:180px;flex-shrink:0;font-size:.78rem;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Archivo',sans-serif;font-weight:600;}
  .gantt-track{position:relative;flex:1;height:22px;background:var(--card);border-radius:6px;overflow:hidden;}
  .gantt-bar{position:absolute;top:2px;bottom:2px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#0d1420;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;font-weight:700;}
  .gantt-header{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:10px;padding:0 0 6px;border-bottom:1px solid #24314f;}
  .gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--gold2);}
  .stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat-card{background:var(--card);border:1px solid #24314f;border-radius:12px;padding:12px 16px;min-width:104px;text-align:center;}
  .stat-card.total{border-color:var(--gold);}
  .stat-card .num{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--gold2);}
  .stat-card .lbl{font-size:.68rem;color:var(--muted);margin-top:2px;font-family:'Archivo',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  .ejec-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .ejec-filters select{background:var(--card);border:1px solid #2a3a5c;color:var(--txt);padding:8px 10px;border-radius:8px;font-size:.85rem;font-family:'Archivo',sans-serif;}
  .card .tarea-num{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--gold2);font-weight:700;}
  .card .fechas-flow{font-size:.72rem;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .gantt-wrap{position:relative;background:var(--card2);border:1px solid #24314f;border-radius:12px;padding:16px;}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
const PROJECT_ID = "babel-tareas";
const API_KEY = "AIzaSyAZ25T-qhy-B_8M9QTCUh1dR18fiaPq0WQ";

const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${COLLECTION}`;

// Alertas WhatsApp (Green API) — grupo "Babel - DISEÑO" (el celular ya está adentro).
const WA = {
  enabled: true,
  instanceId: "710701674285",
  token: "773d18f2bfe6493598a32cfeb453053d74c3af9f1ed24e53bd",
  apiUrl: "https://7107.api.greenapi.com",
  target: "120363410207709341@g.us"
};

const FLOW = ["Pendiente", "En revisión", "Aprobada", "Ejecutada"];
const EXEC_METHODS = ["Imprimir", "Plastificar", "Imprimir y plastificar", "Plotter de corte", "Web", "Publicar", "Subir/cargar", "Otro"];

let ejecFiltroMes = "";
let forzarEstadoAprobada = false;

const $ = (id) => document.getElementById(id);

// ============================================================
// FIRESTORE REST HELPERS
// ============================================================
function encodeValue(v){
  if (v === null || v === undefined) return {nullValue: null};
  if (typeof v === "string") return {stringValue: v};
  if (typeof v === "number") return {doubleValue: v};
  if (typeof v === "boolean") return {booleanValue: v};
  if (Array.isArray(v)) return {arrayValue: {values: v.map(encodeValue)}};
  if (typeof v === "object") return {mapValue: {fields: encodeFields(v)}};
  return {stringValue: String(v)};
}
function encodeFields(obj){
  const out = {};
  for (const k in obj) out[k] = encodeValue(obj[k]);
  return out;
}
function decodeValue(v){
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("doubleValue" in v) return v.doubleValue;
  if ("integerValue" in v) return parseInt(v.integerValue, 10);
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(decodeValue);
  if ("mapValue" in v) return decodeFields(v.mapValue.fields || {});
  return null;
}
function decodeFields(fields){
  const out = {};
  for (const k in fields) out[k] = decodeValue(fields[k]);
  return out;
}

async function fsList(){
  const res = await fetch(`${BASE_URL}?key=${API_KEY}&pageSize=300`);
  const data = await res.json();
  if (!data.documents) return [];
  return data.documents.map(doc => {
    const id = doc.name.split("/documents/")[1].split("/").pop();
    return {id, ...decodeFields(doc.fields || {})};
  });
}
async function fsCreate(data){
  const res = await fetch(`${BASE_URL}?key=${API_KEY}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({fields: encodeFields(data)})
  });
  return res.json();
}
async function fsUpdate(id, data){
  const res = await fetch(`${BASE_URL}/${id}?key=${API_KEY}`, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({fields: encodeFields(data)})
  });
  return res.json();
}
async function fsDelete(id){
  await fetch(`${BASE_URL}/${id}?key=${API_KEY}`, {method: "DELETE"});
}

// ============================================================
// UTIL
// ============================================================
function fmtFecha(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display = "none", 2600);
}
async function sendWA(text){
  if(!WA.enabled || !WA.target) return;
  try{
    await fetch(`${WA.apiUrl}/waInstance${WA.instanceId}/sendMessage/${WA.token}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({chatId: WA.target, message: text})
    });
  }catch(e){ console.warn("WA alert failed", e); }
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function estadoSlug(estado){
  const map = {"Pendiente":"st-pendiente","En revisión":"st-en-revision","Aprobada":"st-aprobada","Ejecutada":"st-ejecutada"};
  return map[estado] || "st-pendiente";
}

// ============================================================
// LOAD / POLL
// ============================================================
async function loadData(){
  try{
    allTareas = await fsList();
    $("connStatus").textContent = `Sincronizado · ${allTareas.length} tarea(s) en total`;
    if(currentTab === "gantt") renderGantt(); else render();
    checkVencidas();
  }catch(e){
    $("connStatus").textContent = "Error de conexión con Firestore: " + e.message;
    console.error(e);
  }
}
// Notificación única de "vencimiento": se dispara una sola vez por tarea, la primera vez
// que alguien tiene la app abierta después de que pasó la fecha límite sin marcarse Ejecutada.
// No requiere un chequeo programado en servidor: se evalúa en cada polling (cada 5s) mientras
// la app esté abierta en algún dispositivo, y queda marcada para no repetirse.
async function checkVencidas(){
  const hoy = new Date().toISOString().slice(0,10);
  const vencidas = allTareas.filter(t => t.fechaLimite && t.fechaLimite < hoy && t.estado !== "Ejecutada" && !t.vencidaNotificada);
  for(const t of vencidas){
    try{
      await sendWA(`⏰ Babel Diseño: "${t.titulo}" venció el ${fmtFecha(t.fechaLimite)} y sigue en *${t.estado}*.`);
      await fsUpdate(t.id, {...stripId(t), vencidaNotificada: true});
    }catch(e){ console.warn("No se pudo notificar vencimiento", e); }
  }
}
function startPolling(){
  loadData();
  pollTimer = setInterval(loadData, 5000);
}

// ============================================================
// RENDER
// ============================================================
function matchesTab(t){
  if(currentTab === "todas") return true;
  return t.estado === currentTab;
}
function computeTareaNumeros(){
  const ejecutadas = allTareas.filter(t => t.estado === "Ejecutada");
  const porAsignado = {};
  ejecutadas.forEach(t=>{
    const k = t.asignado || "Sin asignar";
    (porAsignado[k] = porAsignado[k] || []).push(t);
  });
  const map = {};
  Object.keys(porAsignado).forEach(k=>{
    const arr = porAsignado[k].slice().sort((a,b)=>{
      const fa = a.fechaEjecutada || "9999-99-99", fb = b.fechaEjecutada || "9999-99-99";
      if(fa !== fb) return fa < fb ? -1 : 1;
      return (a.createdAt||0) - (b.createdAt||0);
    });
    arr.forEach((t,i)=>{ map[t.id] = i+1; });
  });
  return map;
}
const MESES_EJEC = [
  {v:"01",l:"Enero"},{v:"02",l:"Febrero"},{v:"03",l:"Marzo"},{v:"04",l:"Abril"},
  {v:"05",l:"Mayo"},{v:"06",l:"Junio"},{v:"07",l:"Julio"},{v:"08",l:"Agosto"},
  {v:"09",l:"Septiembre"},{v:"10",l:"Octubre"},{v:"11",l:"Noviembre"},{v:"12",l:"Diciembre"}
];
function renderEjecPanel(){
  const panel = $("ejecPanel");
  if(currentTab !== "Ejecutada"){
    panel.style.display = "none";
    return null;
  }
  panel.style.display = "block";
  const ejecutadas = allTareas.filter(t => t.estado === "Ejecutada");
  const anios = new Set();
  ejecutadas.forEach(t=>{
    const f = t.fechaEjecutada || t.fechaLimite;
    if(f) anios.add(f.slice(0,4));
  });
  const aniosOrdenados = Array.from(anios).sort().reverse();

  const filtradas = ejecutadas.filter(t=>{
    const f = t.fechaEjecutada || t.fechaLimite || "";
    if(ejecFiltroAnio && f.slice(0,4) !== ejecFiltroAnio) return false;
    if(ejecFiltroMes && f.slice(5,7) !== ejecFiltroMes) return false;
    return true;
  });

  const porAsignado = {};
  filtradas.forEach(t=>{
    const k = t.asignado || "Sin asignar";
    porAsignado[k] = (porAsignado[k]||0) + 1;
  });
  const nombres = Object.keys(porAsignado).sort();
  const cards = nombres.map(n => `<div class="stat-card"><div class="num">${porAsignado[n]}</div><div class="lbl">${esc(n)}</div></div>`).join("");

  panel.innerHTML = `
    <div class="ejec-filters">
      <select id="filtroAnio">
        <option value="">Todos los años</option>
        ${aniosOrdenados.map(a=>`<option value="${a}" ${a===ejecFiltroAnio?"selected":""}>${a}</option>`).join("")}
      </select>
      <select id="filtroMes">
        <option value="">Todos los meses</option>
        ${MESES_EJEC.map(m=>`<option value="${m.v}" ${m.v===ejecFiltroMes?"selected":""}>${m.l}</option>`).join("")}
      </select>
    </div>
    <div class="stats-row">${cards}<div class="stat-card total"><div class="num">${filtradas.length}</div><div class="lbl">Total</div></div></div>`;

  $("filtroAnio").addEventListener("change", (e)=>{ ejecFiltroAnio = e.target.value; render(); });
  $("filtroMes").addEventListener("change", (e)=>{ ejecFiltroMes = e.target.value; render(); });

  return new Set(filtradas.map(t=>t.id));
}
function render(){
  const q = ($("search").value || "").toLowerCase().trim();
  const tipoF = $("filterTipo").value;
  const list = $("list");
  const ejecIds = renderEjecPanel();
  const numeros = computeTareaNumeros();

  let items = allTareas.filter(t=>{
    if(!matchesTab(t)) return false;
    if(ejecIds && !ejecIds.has(t.id)) return false;
    if(tipoF && t.tipo !== tipoF) return false;
    if(q && !(`${t.titulo||""} ${t.descripcion||""}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const prioOrder = {Alta:0, Media:1, Baja:2};
  items.sort((a,b)=>{
    const fa = a.fechaLimite || "9999-99-99", fb = b.fechaLimite || "9999-99-99";
    if(fa !== fb) return fa < fb ? -1 : 1;
    return (prioOrder[a.prioridad] ?? 3) - (prioOrder[b.prioridad] ?? 3);
  });

  if(items.length === 0){
    list.innerHTML = `<div class="empty">No hay tareas en esta vista.</div>`;
    return;
  }

  list.innerHTML = items.map(t=>{
    const badgeEstado = `<span class="badge ${estadoSlug(t.estado)}">${esc((t.estado||"").toUpperCase())}</span>`;
    const badgePrio = `<span class="badge prio-${t.prioridad}">${esc((t.prioridad||"").toUpperCase())}</span>`;
    const fecha = t.fechaLimite ? `📅 ${fmtFecha(t.fechaLimite)}` : "";
    const links = Array.isArray(t.links) ? t.links : [];
    let linkHtml = "";
    if(t.estado === "Ejecutada"){
      const final = links.find(l => l.esDefinitivo) || links[links.length-1];
      if(final) linkHtml = `<a class="link-chip" href="${escAttr(final.url)}" target="_blank" rel="noopener">🔗 ${esc(final.label||"Definitivo")}</a>`;
    } else if(links.length){
      linkHtml = links.map(l => `<a class="link-chip" href="${escAttr(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label||"Link")}</a>`).join(" · ");
    }
    const detalle = (t.estado === "Aprobada" && t.detallePendiente) ? `<div class="detalle">Falta: ${esc(t.detallePendiente)}</div>` : "";
    const metodoTxt = t.metodoEjecucion ? (t.metodoEjecucion === "Otro" && t.metodoEjecucionOtro ? `Otro — ${t.metodoEjecucionOtro}` : t.metodoEjecucion) : "";
    const lineasFecha = [];
    if(t.fechaAprobada) lineasFecha.push(`Aprobada: ${fmtFecha(t.fechaAprobada)}`);
    if(t.fechaEjecutada) lineasFecha.push(`Ejecutada: ${fmtFecha(t.fechaEjecutada)}`);
    if(metodoTxt && (t.estado === "Aprobada" || t.estado === "Ejecutada")) lineasFecha.push(`Método: ${esc(metodoTxt)}`);
    const fechasFlow = lineasFecha.length ? `<div class="fechas-flow">${lineasFecha.join(" · ")}</div>` : "";
    const tareaNum = (t.estado === "Ejecutada" && numeros[t.id]) ? `<div class="tarea-num">Tarea Nº ${numeros[t.id]} de ${esc(t.asignado||"")}</div>` : "";
    const nextActions = renderActions(t);
    return `
      <div class="card" data-id="${t.id}">
        <h3 onclick="openEdit('${t.id}')">${esc(t.titulo || "(sin título)")}</h3>
        <div class="meta">
          ${badgeEstado} ${badgePrio} <span>${esc(t.tipo||"")}</span> <span>${esc(t.asignado||"")}</span> ${fecha ? "· "+fecha : ""}
        </div>
        ${tareaNum}
        ${fechasFlow}
        ${t.descripcion ? `<p>${esc(t.descripcion)}</p>` : ""}
        ${detalle}
        <div class="actions">
          ${linkHtml}
          ${nextActions}
          <button onclick="openEdit('${t.id}')">Editar</button>
        </div>
      </div>`;
  }).join("");
}
const GANTT_COLOR = {"Pendiente":"var(--muted)","En revisión":"var(--rev)","Aprobada":"var(--apr)","Ejecutada":"var(--eje)"};

function renderGantt(){
  const wrap = $("ganttView");
  const items = allTareas
    .filter(t => t.fechaLimite)
    .slice()
    .sort((a,b) => (a.fechaLimite < b.fechaLimite ? -1 : a.fechaLimite > b.fechaLimite ? 1 : 0));

  if(items.length === 0){
    wrap.innerHTML = `<div class="empty">No hay tareas con fecha límite para graficar.</div>`;
    return;
  }

  const todayMs = Date.now();
  const starts = items.map(t => t.createdAt || todayMs);
  const ends = items.map(t => new Date(t.fechaLimite + "T12:00:00").getTime());

  let minMs = Math.min(...starts, todayMs);
  let maxMs = Math.max(...ends, todayMs);
  // padding de 2 días a cada lado para que las barras no queden pegadas al borde
  const padMs = 1000*60*60*24*2;
  minMs -= padMs;
  maxMs += padMs;
  const span = Math.max(maxMs - minMs, 1);

  const pct = ms => ((ms - minMs) / span) * 100;

  const fmtCorta = ms => {
    const d = new Date(ms);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  };

  const rows = items.map(t => {
    const s = t.createdAt || todayMs;
    const e = new Date(t.fechaLimite + "T12:00:00").getTime();
    const left = pct(Math.min(s,e));
    const width = Math.max(pct(Math.max(s,e)) - left, 1.5);
    const color = GANTT_COLOR[t.estado] || "var(--muted)";
    return `
      <div class="gantt-row">
        <div class="gantt-label" title="${escAttr(t.titulo||"")}">${esc(t.titulo || "(sin título)")}</div>
        <div class="gantt-track">
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color};" title="${escAttr((t.estado||"")+" · vence "+fmtFecha(t.fechaLimite))}">${esc(fmtFecha(t.fechaLimite))}</div>
        </div>
      </div>`;
  }).join("");

  const todayLeft = pct(todayMs);

  wrap.innerHTML = `
    <div class="gantt-wrap">
      <div class="gantt-header"><span>${fmtCorta(minMs)}</span><span>Hoy</span><span>${fmtCorta(maxMs)}</span></div>
      <div style="position:relative;">
        <div class="gantt-today" style="left:${todayLeft}%;"></div>
        ${rows}
      </div>
    </div>`;
}

function renderActions(t){
  const idx = FLOW.indexOf(t.estado);
  if(idx >= 0 && idx < FLOW.length-1){
    const next = FLOW[idx+1];
    const label = (next === "Aprobada") ? "✓ Elegir método y aprobar" : `✓ Pasar a ${next}`;
    return `<button onclick="advance('${t.id}','${next}')">${label}</button>`;
  }
  return "";
}
function escAttr(s){ return esc(s); }

async function advance(id, nextEstado){
  const t = allTareas.find(x=>x.id===id);
  if(!t) return;
  if(nextEstado === "Aprobada"){
    // El método de ejecución es obligatorio para pasar a Aprobada — se pide en el modal.
    openEdit(id, "Aprobada");
    return;
  }
  const extra = {};
  if(nextEstado === "Ejecutada") extra.fechaEjecutada = t.fechaEjecutada || todayISO();
  await fsUpdate(id, {...stripId(t), estado: nextEstado, updatedAt: Date.now(), ...extra});
  showToast(`"${t.titulo}" → ${nextEstado}`);
  sendWA(`📐 Babel Diseño: "${t.titulo}" pasó a *${nextEstado}*.`);
  loadData();
}
function stripId(t){
  const {id, ...rest} = t;
  return rest;
}
window.advance = advance;
window.openEdit = openEdit;

  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.f;
    if(currentTab === "gantt"){
      $("toolbarNormal").style.display = "none";
      $("list").style.display = "none";
      $("ejecPanel").style.display = "none";
      $("ganttView").style.display = "block";
      renderGantt();
    } else {
      $("toolbarNormal").style.display = "flex";
      $("list").style.display = "block";
      $("ganttView").style.display = "none";
      render();
    }
  });
});
$("search").addEventListener("input", render);
$("filterTipo").addEventListener("change", render);
$("refreshBtn").addEventListener("click", loadData);

// ============================================================
// LINKS SUB-EDITOR
// ============================================================
function renderLinksList(){
  const wrap = $("linksList");
  if(!currentLinks.length){ wrap.innerHTML = `<div style="font-size:.75rem;color:var(--muted);">Sin links todavía.</div>`; return; }
  wrap.innerHTML = currentLinks.map((l,i)=>`
    <div class="link-row">
      <span class="lbl ${l.esDefinitivo?'final':''}">${esc(l.label||'Link')}</span>
      <a href="${escAttr(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>
      <button type="button" title="Marcar como definitivo" onclick="markFinalLink(${i})">${l.esDefinitivo ? '★' : '☆'}</button>
      <button type="button" title="Quitar" onclick="removeLink(${i})">✕</button>
    </div>`).join("");
}
window.markFinalLink = function(i){
  currentLinks.forEach((l,idx)=> l.esDefinitivo = (idx===i));
  renderLinksList();
};
window.removeLink = function(i){
  currentLinks.splice(i,1);
  renderLinksList();
};
$("addLinkBtn").addEventListener("click", ()=>{
  const label = $("newLinkLabel").value.trim() || `Link ${currentLinks.length+1}`;
  const url = $("newLinkUrl").value.trim();
  if(!url){ showToast("Falta la URL del link"); return; }
  currentLinks.push({label, url, esDefinitivo:false, addedAt: Date.now()});
  $("newLinkLabel").value = "";
  $("newLinkUrl").value = "";
  renderLinksList();
});

// ============================================================
// ADJUNTOS (Cloudinary — misma cuenta que Gestor de Tareas Socios)
// ============================================================
const CLOUDINARY_CLOUD = "dmg4sk7k";
const CLOUDINARY_PRESET = "babel_uploads";

$("uploadFileBtn").addEventListener("click", async ()=>{
  const file = $("fileInput").files[0];
  if(!file){ showToast("Elegí un archivo primero"); return; }
  const status = $("uploadStatus");
  status.style.display = "block";
  status.textContent = "Subiendo archivo...";
  try{
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, {method:"POST", body: fd});
    const json = await res.json();
    if(json.secure_url){
      currentLinks.push({label: file.name, url: json.secure_url, esDefinitivo:false, addedAt: Date.now()});
      renderLinksList();
      status.textContent = "Archivo adjuntado ✓";
      $("fileInput").value = "";
      setTimeout(()=> status.style.display="none", 2000);
    } else {
      status.textContent = "Error al subir: " + (json.error?.message || "desconocido");
    }
  }catch(e){
    status.textContent = "Error al subir: " + e.message;
  }
});

// ============================================================
// MODAL / CRUD
// ============================================================
function resetForm(){
  $("f_titulo").value = "";
  $("f_tipo").value = "Flyer";
  $("f_descripcion").value = "";
  $("f_asignado").value = "Rolando";
  $("f_prioridad").value = "Media";
  $("f_fecha").value = "";
  $("f_estado").value = "Pendiente";
  $("f_metodo").value = "";
  $("f_metodoOtro").value = "";
  $("metodoOtroWrap").style.display = "none";
  $("f_detalle").value = "";
  $("f_notas").value = "";
  currentLinks = [];
  editingFechaAprobada = "";
  editingFechaEjecutada = "";
  editingCreatedAt = 0;
  renderLinksList();
}

$("f_metodo").addEventListener("change", ()=>{
  $("metodoOtroWrap").style.display = ($("f_metodo").value === "Otro") ? "block" : "none";
});

$("newBtn").addEventListener("click", ()=>{
  editingId = null;
  forzarEstadoAprobada = false;
  resetForm();
  $("modalTitle").textContent = "Nueva tarea";
  $("deleteBtn").style.display = "none";
  $("modalBg").classList.add("open");
});

function openEdit(id, forceEstado){
  const t = allTareas.find(x=>x.id===id);
  if(!t) return;
  editingId = id;
  $("f_titulo").value = t.titulo || "";
  $("f_tipo").value = t.tipo || "Flyer";
  $("f_descripcion").value = t.descripcion || "";
  $("f_asignado").value = t.asignado || "Rolando";
  $("f_prioridad").value = t.prioridad || "Media";
  $("f_fecha").value = t.fechaLimite || "";
  $("f_estado").value = forceEstado || t.estado || "Pendiente";
  $("f_metodo").value = t.metodoEjecucion || "";
  $("f_metodoOtro").value = t.metodoEjecucionOtro || "";
  $("metodoOtroWrap").style.display = ($("f_metodo").value === "Otro") ? "block" : "none";
  $("f_detalle").value = t.detallePendiente || "";
  $("f_notas").value = t.notas || "";
  currentLinks = Array.isArray(t.links) ? JSON.parse(JSON.stringify(t.links)) : [];
  editingFechaAprobada = t.fechaAprobada || "";
  editingFechaEjecutada = t.fechaEjecutada || "";
  editingCreatedAt = t.createdAt || 0;
  renderLinksList();
  $("modalTitle").textContent = "Editar tarea";
  $("deleteBtn").style.display = "inline-block";
  $("modalBg").classList.add("open");
  if(forceEstado === "Aprobada" && !t.metodoEjecucion){
    showToast("Elegí el método de ejecución para aprobar la tarea");
  }
}

$("cancelBtn").addEventListener("click", ()=> $("modalBg").classList.remove("open"));
$("modalBg").addEventListener("click", (e)=>{ if(e.target.id==="modalBg") $("modalBg").classList.remove("open"); });

$("saveBtn").addEventListener("click", async ()=>{
  const titulo = $("f_titulo").value.trim();
  if(!titulo){ showToast("Falta el título"); return; }
  const estado = $("f_estado").value;
  const metodoEjecucion = $("f_metodo").value;
  if((estado === "Aprobada" || estado === "Ejecutada") && !metodoEjecucion){
    showToast("Elegí el método de ejecución antes de aprobar la tarea");
    return;
  }
  let fechaAprobada = editingFechaAprobada;
  if(!fechaAprobada && (estado === "Aprobada" || estado === "Ejecutada")) fechaAprobada = todayISO();
  let fechaEjecutada = editingFechaEjecutada;
  if(!fechaEjecutada && estado === "Ejecutada") fechaEjecutada = todayISO();
  const data = {
    titulo,
    tipo: $("f_tipo").value,
    descripcion: $("f_descripcion").value.trim(),
    links: currentLinks,
    asignado: $("f_asignado").value,
    prioridad: $("f_prioridad").value,
    fechaLimite: $("f_fecha").value,
    estado,
    metodoEjecucion,
    metodoEjecucionOtro: (metodoEjecucion === "Otro") ? $("f_metodoOtro").value.trim() : "",
    fechaAprobada,
    fechaEjecutada,
    detallePendiente: $("f_detalle").value.trim(),
    notas: $("f_notas").value.trim(),
    updatedAt: Date.now(),
    vencidaNotificada: false
  };
  if(editingId){
    const prev = allTareas.find(x=>x.id===editingId);
    const estadoCambio = prev && prev.estado !== data.estado;
    data.createdAt = editingCreatedAt || Date.now();
    await fsUpdate(editingId, data);
    showToast("Tarea actualizada");
    if(estadoCambio){
      sendWA(`📐 Babel Diseño: "${titulo}" pasó a *${data.estado}*.`);
    } else {
      sendWA(`📐 Babel Diseño: se modificó la tarea "${titulo}".`);
    }
  } else {
    data.createdAt = Date.now();
    await fsCreate(data);
    showToast("Tarea creada");
    sendWA(`📐 Babel Diseño: nueva tarea — "${titulo}" (${data.tipo}, prioridad ${data.prioridad}, asignado: ${data.asignado}).`);
  }
  $("modalBg").classList.remove("open");
  loadData();
});

$("deleteBtn").addEventListener("click", async ()=>{
  if(!editingId) return;
  if(!confirm("¿Eliminar esta tarea? Esta acción no se puede deshacer.")) return;
  await fsDelete(editingId);
  showToast("Tarea eliminada");
  $("modalBg").classList.remove("open");
  loadData();
});

// ============================================================
// INIT
// ============================================================
startPolling();
</script>
